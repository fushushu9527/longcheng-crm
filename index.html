<main class="page">
  <div id="local-banner"></div>

  <!-- ===== KPI 指标 ===== -->
  <div class="kpi-grid" id="kpi-grid"></div>

  <!-- ===== 趋势 + 漏斗 ===== -->
  <div class="grid dash-wide mt16">
    <div class="card">
      <div class="card-head">
        <h3>近14天数据趋势</h3>
        <div class="head-right">
          <span class="card-note">收集 / 转换 / 到访</span>
        </div>
      </div>
      <div id="trend-chart" style="width:100%;height:280px"></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>客户阶段漏斗</h3><span class="card-note right">全链路</span></div>
      <div id="funnel-chart" style="width:100%;height:280px"></div>
    </div>
  </div>

  <!-- ===== 擂台 ===== -->
  <div class="grid dash-mid mt16">
    <div class="card">
      <div class="card-head"><h3>信息擂台</h3><span class="badge blue">收集</span></div>
      <div id="info-podium"></div>
      <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:12px">
        <div class="card tight"><div class="card-note mb8">今日</div><div id="info-today"></div></div>
        <div class="card tight"><div class="card-note mb8">累计</div><div id="info-total"></div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>到访擂台</h3><span class="badge green">接待</span></div>
      <div id="visit-podium"></div>
      <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:12px">
        <div class="card tight"><div class="card-note mb8">今日</div><div id="visit-today"></div></div>
        <div class="card tight"><div class="card-note mb8">累计</div><div id="visit-total"></div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-head">
        <h3>人员战力榜</h3>
        <div class="head-right">
          <select class="input btn-sm" id="rank-metric" style="width:auto;padding:6px 26px 6px 10px">
            <option value="collected">信息收集</option>
            <option value="converted">信息转换</option>
            <option value="visited" selected>到访接待</option>
            <option value="forced">逼定</option>
            <option value="deals">成交</option>
          </select>
        </div>
      </div>
      <div class="rank-list" id="rank-list"></div>
    </div>
  </div>

  <!-- ===== 待跟进 + 高意向 ===== -->
  <div class="grid dash-row mt16">
    <div class="card">
      <div class="card-head"><h3>待跟进客户</h3>
        <a class="btn btn-sm right" href="customers.html?filter=follow">全部</a>
      </div>
      <div class="customer-list" id="follow-list"></div>
    </div>
    <div class="card">
      <div class="card-head"><h3>高意向客户（A类）</h3>
        <a class="btn btn-sm right" href="customers.html?filter=A">全部</a>
      </div>
      <div class="customer-list" id="a-list"></div>
    </div>
  </div>
</main>
