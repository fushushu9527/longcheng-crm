<main class="page">
  <div class="page-head">
    <h1>客户录音归档</h1>
    <div class="sub">录音自动挂到客户跟进时间轴，支持直接上传或粘贴飞书云盘外链</div>
  </div>

  <div class="chip-row" id="src-chips">
    <button class="chip active" data-src="upload">上传音频文件</button>
    <button class="chip" data-src="link">粘贴外部链接</button>
  </div>

  <div class="card mb16">
    <form id="rec-form">
      <div class="form-grid two-col">
        <div class="form-row"><label>关联客户<span class="req">*</span></label>
          <select class="input" id="r-customer"><option value="">请选择</option></select></div>
        <div class="form-row"><label>录音名称</label><input class="input" id="r-name" placeholder="如：9月28日电话沟通"></div>
      </div>

      <div class="form-row" id="upload-box">
        <label>音频文件（建议 20MB 以内，支持 mp3/m4a/wav）</label>
        <input class="input" type="file" id="r-file" accept="audio/*">
        <div class="field-hint">文件将上传到 GitHub 仓库；过大的录音建议先存飞书云盘再用链接方式</div>
      </div>
      <div class="form-row hide" id="link-box">
        <label>音频外链（飞书云盘 / 网盘的可访问链接）</label>
        <input class="input" id="r-url" placeholder="https://...">
      </div>

      <div class="form-row"><label>录音摘要 / 客户关键信息</label>
        <textarea class="input" id="r-summary" style="min-height:80px" placeholder="可粘贴录音转文字内容或记录要点"></textarea></div>
      <button class="btn btn-primary btn-block" type="submit" data-edit>归档录音</button>
    </form>
  </div>

  <h3 class="mb16">已归档录音（<span id="rec-count">0</span>）</h3>
  <div id="rec-list" class="grid"></div>
</main>
