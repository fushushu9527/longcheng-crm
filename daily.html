<main class="page">
  <div class="page-head">
    <h1>意向客户统计及分析日报表</h1>
    <div class="head-right">
      <input class="input" type="date" id="date-pick" style="width:auto">
      <span class="badge" id="week-pill"></span>
    </div>
  </div>

  <div class="banner info">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg>
    蓝色数字由报备数据自动统计；今日列可直接填入数字进行手动修正，保存后生效。
  </div>

  <!-- 信息资源 + 信息擂台 -->
  <div class="card mb16">
    <div class="table-wrap">
      <table class="report-table" id="t-info"></table>
    </div>
  </div>

  <!-- 到访 + 到访擂台 -->
  <div class="card mb16">
    <div class="table-wrap">
      <table class="report-table" id="t-visit"></table>
    </div>
  </div>

  <!-- 逼定布局 -->
  <div class="card mb16">
    <h3 class="mb16">意向客户逼定布局</h3>
    <div class="table-wrap">
      <table class="report-table" id="t-force"></table>
    </div>
    <div class="grid mt16" style="grid-template-columns:1fr">
      <div class="card tight">
        <div class="flex aic mb8"><span class="semibold small">逼定布局清单（计划逼定）</span>
          <button class="btn btn-sm right" id="btn-add-plan" data-edit>添加布局</button></div>
        <div id="plan-list"></div>
      </div>
      <div class="card tight">
        <div class="form-row mb0"><label>客户逼定布局注意事项</label>
          <textarea class="input" id="force-notes" style="min-height:70px" data-edit></textarea></div>
      </div>
    </div>
  </div>

  <!-- 成交统计 -->
  <div class="card mb16">
    <h3 class="mb16">客户成交统计</h3>
    <div class="table-wrap">
      <table class="report-table" id="t-deal"></table>
    </div>
  </div>

  <button class="btn btn-primary btn-block" id="btn-save" data-edit>保存日报（手动修正与注意事项）</button>
</main>
