<main class="page">
  <div class="page-head">
    <h1>报备录入</h1>
    <div class="sub">直接粘贴微信报备消息自动识别归档，支持「内部客户报备」一体化格式与信息/转换/首访/再访，可一次粘贴多条</div>
  </div>

  <!-- 粘贴区 -->
  <div class="card">
    <div class="form-row">
      <label>微信报备内容</label>
      <textarea class="input" id="raw" style="min-height:190px" placeholder="例如（内部客户报备，一条含全部阶段）：&#10;龙城·营峰天境&#10;内部客户报备&#10;客户信息编码：TYG1002&#10;客户信息来源：客户自然到访&#10;客户姓名称呼：隆先生&#10;客户大概画像：男45岁 一家人看房&#10;客户联系方式：182xxxx7075，微信已私发&#10;信息报备时间：10月02日&#10;信息报备人员：唐毅高&#10;首次到访时间：10月02日10:00&#10;首次接待人员：唐毅高&#10;客户意向等级：A&#10;客户反馈意见：房产证能否正常办理&#10;再次到访时间：10月02日14:36&#10;再次接待人员：唐毅高&#10;客户反馈意见：考虑下这两天定房"></textarea>
    </div>
    <div class="flex gap8">
      <button class="btn" id="btn-sample">填入示例</button>
      <button class="btn btn-primary right" id="btn-parse" data-edit>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        解析预览</button>
    </div>
  </div>

  <!-- 解析结果 -->
  <div id="preview" class="mt16"></div>

  <hr class="divider mt24">

  <!-- 手动录入 -->
  <div class="page-head"><h1 style="font-size:1.15rem">手动填写报备</h1></div>
  <div class="chip-row" id="type-chips">
    <button class="chip active" data-type="info">信息报备</button>
    <button class="chip" data-type="convert">转换报备</button>
    <button class="chip" data-type="firstVisit">首访报备</button>
    <button class="chip" data-type="revisit">再访报备</button>
  </div>
  <div class="card">
    <form id="manual-form">
      <div class="form-grid two-col" id="manual-fields"></div>
      <button class="btn btn-primary btn-block mt8" type="submit" data-edit>提交报备</button>
    </form>
  </div>
</main>
